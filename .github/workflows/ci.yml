# MITOS Terminal — CI
#
# Every check runs as its own job so failures are independent and legible
# (a clippy nit never hides a test failure). `ci` at the bottom depends on
# all of them and is the one check to require in branch protection.
#
# Private git dependencies: `mitos-utils` and `mitos-pkg` (see Cargo.toml)
# are fetched by Cargo itself over the URLs already in Cargo.toml — no
# separate clone step is needed. If either repo is private, the runner
# needs credentials for it (a deploy key or a PAT with access), e.g.:
#
#   - name: Configure git for a private dependency
#     run: git config --global url."https://x-access-token:${{ secrets.MITOS_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"
#
# add that as a step before "Setup Rust toolchain" in any job below if so.

name: MITOS Terminal CI

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A new push to the same branch/PR cancels whatever CI was already running
# for it, so pushing twice quickly doesn't burn double the runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Formatting — fast, no system deps or compilation needed.
  # ---------------------------------------------------------------------
  fmt:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------
  # Lint — a real gate (not continue-on-error): "check everything" means a
  # clippy warning should fail CI, the same as a broken build would.
  # ---------------------------------------------------------------------
  clippy:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (eframe/winit, arboard, PTY)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxext-dev \
            libxtst-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libssl-dev \
            libclang-dev \
            libfontconfig1-dev \
            pkg-config \
            xclip \
            wl-clipboard
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------
  # Build — debug and release, so a release-profile-only problem (LTO,
  # codegen-units = 1, strip — see Cargo.toml) can't slip through.
  # ---------------------------------------------------------------------
  build:
    name: Build (debug + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (eframe/winit, arboard, PTY)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxext-dev \
            libxtst-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libssl-dev \
            libclang-dev \
            libfontconfig1-dev \
            pkg-config \
            xclip \
            wl-clipboard
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (debug)
        run: cargo build --workspace --all-targets --verbose
      - name: cargo build (release)
        run: cargo build --workspace --release --verbose
      - name: Sanity-check the release binary exists
        run: test -x target/release/mitos-terminal

  # ---------------------------------------------------------------------
  # Tests — unit tests (throughout src/, including the VT-compatibility
  # fuzzer and the session/PTY tests that spawn real shells), the
  # integration suite in tests/, and doctests. All of it is headless-safe:
  # nothing here opens a window or needs a GPU/display, so no Xvfb needed.
  # ---------------------------------------------------------------------
  test:
    name: Test (unit + integration + doctests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (eframe/winit, arboard, PTY)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxext-dev \
            libxtst-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libssl-dev \
            libclang-dev \
            libfontconfig1-dev \
            pkg-config \
            xclip \
            wl-clipboard
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (lib, bins, tests)
        run: cargo test --workspace --all-targets --verbose
      - name: cargo test --doc
        run: cargo test --workspace --doc --verbose

  # ---------------------------------------------------------------------
  # Docs — fails on broken intra-doc links or other rustdoc warnings, which
  # `cargo build` never surfaces on its own.
  # ---------------------------------------------------------------------
  docs:
    name: Docs build (no warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (eframe/winit, arboard, PTY)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev \
            libssl-dev libclang-dev libfontconfig1-dev pkg-config
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --workspace --no-deps --document-private-items

  # ---------------------------------------------------------------------
  # Security audit — a terminal emulator parses attacker-controlled bytes
  # by design (see security.rs, term/perform.rs), so a known-vulnerable
  # dependency is worth catching automatically. Advisory-only: the RustSec
  # database changes over time and a new advisory can land with no code
  # change on our side, so this reports without blocking merges.
  # ---------------------------------------------------------------------
  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  # ---------------------------------------------------------------------
  # Beta-toolchain canary — catches upcoming compiler/clippy changes early.
  # Non-blocking: this is a heads-up, not a requirement to build on beta.
  # ---------------------------------------------------------------------
  beta-canary:
    name: Beta toolchain (canary)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (eframe/winit, arboard, PTY)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxi-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libssl-dev libclang-dev \
            libfontconfig1-dev pkg-config
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@beta
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --verbose
      - run: cargo test --workspace --all-targets --verbose

  # ---------------------------------------------------------------------
  # Single required check for branch protection: green iff every blocking
  # job above is green. (audit and beta-canary are advisory, so they're not
  # in `needs` — a real advisory still shows up on the PR, it just doesn't
  # block it.)
  # ---------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [fmt, clippy, build, test, docs]
    if: always()
    steps:
      - name: Fail if any required job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - name: All required jobs passed
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "fmt, clippy, build, test, and docs all passed."
