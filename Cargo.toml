[package]
name = "mitos-terminal"
version = "0.2.0"
edition = "2021"
description = "MITOS's native terminal emulator"

[lib]
name = "mitos_terminal"
path = "src/lib.rs"

[[bin]]
name = "mitos-terminal"
path = "src/main.rs"

[dependencies]
portable-pty = "0.8.1"  # Layer 1: Process handling
vte = "0.13.0"          # Layer 2: ANSI parser
eframe = "0.28.1"       # Layer 4: GUI Framework
egui = "0.28.1"         # Layer 4: Immediate mode UI
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# later: mitos-utils = { path = "../mitos-utils" }
mitos-utils = { git = "https://github.com/shark-empire/mitos-utils" }
# For the "command not found -> install" bridge in pkg_bridge.rs —
# links mitos-pkgd's own DaemonClient rather than reimplementing its
# socket protocol.
mitos-pkg = { git = "https://github.com/shark-empire/mitos-pkg" }

notify = "6.1"          # Hot-reloading terminal.toml / home.conf
dirs = "5.0"            # Resolving ~/.config/mitos
arboard = "3.4"         # Persistent clipboard (+ X11 primary selection)
open = "5.0"

toml = "0.8"            # terminal.toml (profiles, themes, keybindings, policy)
libc = "0.2"            # kill(2), signal handling, getuid (already in the tree via portable-pty)
unicode-width = "0.1"   # Cell widths (CJK / emoji / combining marks)

# Speed is a hard requirement for every MITOS component.
# NOTE: do not switch to panic = "abort" — session-level crash isolation
# (catch_unwind around the VT parser) depends on unwinding.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"

# egui is unusably slow at opt-level 0; keep dev builds interactive.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
